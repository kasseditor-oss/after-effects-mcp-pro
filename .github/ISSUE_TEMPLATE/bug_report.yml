name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool call (name and arguments), what you expected and what you got.
    validations:
      required: true
  - type: input
    id: ae
    attributes:
      label: After Effects version
      description: Help > About After Effects, e.g. 26.5 (Beta or release)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Windows 11 24H2, macOS 15.5
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server version and MCP client
      description: "`npx after-effects-mcp-pro --version`, and Claude Desktop / Claude Code / other"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: bridge_status output
      description: Call the bridge_status tool and paste its JSON (remove paths you do not want to share).
      render: json
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages, screenshots of a dialog in After Effects, preview frames.
