name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: ExtendScript files parse as ES3
        run: npm run check:es3
      - run: npm run build
      - name: Claude Desktop extension manifest is up to date
        run: node scripts/gen-manifest.mjs --check
      # Unit tests never need After Effects. They include the tools/list snapshot,
      # so an accidental change to a tool's name, schema or annotations fails CI.
      - run: npm test
